services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: serein
      POSTGRES_USER: serein
      POSTGRES_PASSWORD: serein
    ports:
      - "5432:5432"
    volumes:
      - serein_pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  serein_pg:
