databases:
  - name: serein-db
    databaseName: serein
    user: serein
    plan: basic-256mb
    region: ohio

services:
  - type: web
    name: serein-api
    runtime: node
    plan: starter
    region: ohio
    buildCommand: npm ci && npm run db:generate
    preDeployCommand: npm run db:deploy
    startCommand: npm run start --workspace=server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: serein-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: FX_USD_INR
        value: "83.5"
